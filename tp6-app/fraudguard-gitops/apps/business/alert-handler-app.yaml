apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alert-handler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/raphaelpietrzak/fraudguard-gitops.git
    targetRevision: main
    path: manifests/business/alert-handler
  destination:
    server: https://kubernetes.default.svc
    namespace: fraudguard
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
