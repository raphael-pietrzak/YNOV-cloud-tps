apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: latency-kafka-detector
  namespace: fraudguard
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - fraudguard
    labelSelectors:
      app: fraud-detector
  delay:
    latency: '200ms'
    correlation: '50'
    jitter: '50ms'
  target:
    selector:
      namespaces:
        - fraudguard
      labelSelectors:
        strimzi.io/cluster: fraudguard-kafka
    mode: all
  duration: '3m'
