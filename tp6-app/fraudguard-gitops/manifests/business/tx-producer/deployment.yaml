apiVersion: apps/v1
kind: Deployment
metadata:
  name: tx-producer
  namespace: fraudguard
  labels:
    app: tx-producer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tx-producer
  template:
    metadata:
      labels:
        app: tx-producer
    spec:
      containers:
        - name: tx-producer
          image: europe-west9-docker.pkg.dev/fraudguard-prod/tp2-registry/tx-producer:v1
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "fraudguard-kafka-kafka-bootstrap.fraudguard.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "transactions-raw"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          ports:
            - name: metrics
              containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: tx-producer
  namespace: fraudguard
  labels:
    app: tx-producer
spec:
  selector:
    app: tx-producer
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
