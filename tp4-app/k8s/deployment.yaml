apiVersion: v1
kind: ServiceAccount
metadata:
  name: finsecure-app-ksa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: finsecure-github-sa@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-app
  labels:
    app: finsecure-app
    team: backend
    environment: production
    feature: payments
    cost-center: engineering
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsecure-app
  template:
    metadata:
      labels:
        app: finsecure-app
    spec:
      serviceAccountName: finsecure-app-ksa

      initContainers:
        - name: fetch-secrets
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command:
            - /bin/sh
            - -c
            - |
              gcloud secrets versions access latest \
                --secret="finsecure-db-password" \
                --project="${PROJECT_ID}" \
                > /secrets/db-password
          env:
            - name: PROJECT_ID
              value: "PROJECT_ID"
          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets

      containers:
        - name: finsecure-app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_HOST
              value: "REDIS_IP_PLACEHOLDER"
            - name: REDIS_PORT
              value: "6379"
            - name: GCP_PROJECT
              value: "PROJECT_ID"
          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: secrets-vol
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: finsecure-app-service
spec:
  type: LoadBalancer
  selector:
    app: finsecure-app
  ports:
    - port: 80
      targetPort: 3000
